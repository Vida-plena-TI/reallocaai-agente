# Casos reais do RealocAI: perguntas da coordenação, com a resposta certa
# conferida na planilha. Como adicionar um caso: docs/avaliacao.md.
#
# Campos de cada caso:
#   id, descricao     identificação (nunca nomes de pacientes)
#   hoje              data "hoje" fixa da conversa (AAAA-MM-DD)
#   so_ficticia       true quando o caso depende dos nomes da semana fictícia
#                     (tests/casos_reais/planilha.py); pulado com --planilha-id
#   xfail             motivo de o caso ainda falhar; o pytest marca xfail
#                     estrito (passar sem tirar a marca também é erro)
#   turnos            perguntas em sequência, na mesma conversa; `chamada` é
#                     a tool que o modo --deterministico executa no lugar da LLM
#   criterios         verificações; `turno: N` (a partir de 1) limita a um turno
#
# Datas nos argumentos: "{segunda}" ... "{sabado}" viram a data desse dia na
# semana de `hoje`. Os critérios estão em tests/casos_reais/casos.py.

- id: c01
  descricao: Vagas de um dia ("quais horários vagos na segunda-feira?")
  hoje: 2026-09-28
  turnos:
    - pergunta: quais horários vagos na segunda-feira?
      chamada:
        tool: gerar_relatorio
        args: {relatorio: vagas_livres, inicio: "{segunda}", fim: "{segunda}"}
  criterios:
    - {tipo: bloco_presente, bloco: disponibilidade}
    - {tipo: vagas_iguais_ao_oraculo, dias: [segunda]}
    - {tipo: maximo_de_frases, maximo: 3}
    - {tipo: sem_linhas_hh_mm}

- id: c02
  descricao: Encaixe na terça de manhã, entre 10h e 12h, 30 min, qualquer especialidade
  hoje: 2026-09-28
  xfail: >-
    buscar_encaixe não tem limite de término nem aceita "qualquer
    especialidade": com as fonos lotadas das 10h às 12h, devolve a tarde, e
    a vaga de psicologia das 10:00 nem é procurada.
  turnos:
    - pergunta: >-
        tenho um paciente pra encaixar na terça de manhã, entre 10h e 12h,
        30 minutos, pode ser qualquer especialidade. o que tem?
      chamada:
        tool: buscar_encaixe
        args:
          data: "{terca}"
          itens: [{especialidade: fonoaudiologia, duracao_minutos: 30}]
          horario_minimo: "10:00"
          horario_desejado: "10:00"
  criterios:
    - {tipo: vagas_dentro_da_janela, inicio: "10:00", fim: "12:00"}

- id: c03
  descricao: Disponibilidade quarta e quinta, fono e psicomotricidade, 10h às 12h
  hoje: 2026-09-28
  xfail: >-
    gerar_relatorio não tem janela de horário, só manhã/tarde: as faixas das
    07:00 às 10:00 entram junto.
  turnos:
    - pergunta: >-
        quais as vagas de fono e psicomotricidade na quarta e na quinta,
        entre 10h e 12h?
      chamada:
        tool: gerar_relatorio
        args:
          relatorio: vagas_livres
          inicio: "{quarta}"
          fim: "{quinta}"
          especialidades: [fono, psicomotricidade]
          periodo_do_dia: manha
  criterios:
    - {tipo: bloco_presente, bloco: disponibilidade}
    - {tipo: vagas_dentro_da_janela, inicio: "10:00", fim: "12:00"}

- id: c04
  descricao: Plano semanal quarta e quinta, 4 especialidades de 30 min, 10h às 12h
  hoje: 2026-09-28
  xfail: Ainda não existe a tool de plano semanal (planejar_semana).
  turnos:
    - pergunta: >-
        monta pra mim um plano na quarta e na quinta, das 10h às 12h, com
        fono, psicomotricidade, psicologia e terapia ocupacional, 30 minutos
        cada
      chamada:
        tool: planejar_semana
        args:
          dias: ["{quarta}", "{quinta}"]
          inicio: "10:00"
          fim: "12:00"
          itens:
            - {especialidade: fonoaudiologia, duracao_minutos: 30}
            - {especialidade: psicomotricidade, duracao_minutos: 30}
            - {especialidade: psicologia, duracao_minutos: 30}
            - {especialidade: terapia_ocupacional, duracao_minutos: 30}
  criterios:
    - {tipo: sem_sobreposicao_no_dia}
    - {tipo: vagas_dentro_da_janela, inicio: "10:00", fim: "12:00"}
    - {tipo: nao_coube_com_alternativas}
    - tipo: frase_proibida
      frases: ["bloco contínuo de 120 minutos", "cada data foi verificada"]

- id: c05
  descricao: >-
    Nomes de profissional: apelido, grafia diferente e os três estados (não
    existe, não atende no dia, sem vaga na janela)
  hoje: 2026-09-28
  so_ficticia: true
  turnos:
    - pergunta: a beatriz tem vaga na quinta entre 10h e 12h?
      chamada:
        tool: consultar_disponibilidade
        args: {data: "{quinta}", profissional: beatriz, horario_inicio: "10:00", horario_fim: "12:00"}
    - pergunta: e a ASSIZELLY, na quarta, no mesmo horário?
      chamada:
        tool: consultar_disponibilidade
        args: {data: "{quarta}", profissional: ASSIZELLY, horario_inicio: "10:00", horario_fim: "12:00"}
    - pergunta: e a Zuleide na quinta?
      chamada:
        tool: consultar_disponibilidade
        args: {data: "{quinta}", profissional: Zuleide, horario_inicio: "10:00", horario_fim: "12:00"}
    - pergunta: e a Elo na quinta?
      chamada:
        tool: consultar_disponibilidade
        args: {data: "{quinta}", profissional: Elo, horario_inicio: "10:00", horario_fim: "12:00"}
    - pergunta: e a Carol na quinta, entre 10h e 12h?
      chamada:
        tool: consultar_disponibilidade
        args: {data: "{quinta}", profissional: Carol, horario_inicio: "10:00", horario_fim: "12:00"}
  criterios:
    # "beatriz" = Bia: apelido confirmado pela coordenadora (PROFISSIONAIS_APELIDOS).
    - {tipo: estado_profissional, turno: 1, na_planilha: Bia, dia: quinta, inicio: "10:00", fim: "12:00"}
    - {tipo: estado_profissional, turno: 2, na_planilha: Assizely, dia: quarta, inicio: "10:00", fim: "12:00"}
    - {tipo: estado_profissional, turno: 3, na_planilha: null, dia: quinta, inicio: "10:00", fim: "12:00"}
    - {tipo: estado_profissional, turno: 4, na_planilha: Elo, dia: quinta, inicio: "10:00", fim: "12:00"}
    - {tipo: estado_profissional, turno: 5, na_planilha: Carol, dia: quinta, inicio: "10:00", fim: "12:00"}

- id: c06
  descricao: Realocação com autorização do usuário ("pode mover o que for necessário")
  hoje: 2026-09-28
  xfail: >-
    Ainda não existe a tool de realocação por pedido (planejar_realocacao);
    sugerir_realocacao exige atendimento_id.
  turnos:
    - pergunta: >-
        preciso encaixar psicologia de 1 hora na quarta às 10h para um
        paciente novo
      chamada:
        tool: buscar_encaixe
        args:
          data: "{quarta}"
          itens: [{especialidade: psicologia, duracao_minutos: 60}]
          horario_desejado: "10:00"
    - pergunta: pode mover o que for necessário
      chamada:
        tool: planejar_realocacao
        args:
          data: "{quarta}"
          itens: [{especialidade: psicologia, duracao_minutos: 60}]
          horario_desejado: "10:00"
  criterios:
    - {tipo: nao_pede_atendimento_id}
    - {tipo: max_planos, turno: 2, maximo: 3}

- id: c07
  descricao: 'Regressão: "vagas de segunda a sexta" em 1 chamada à planilha e menos de 20 s'
  hoje: 2026-09-28
  turnos:
    - pergunta: vagas de segunda a sexta
      chamada:
        tool: gerar_relatorio
        args: {relatorio: vagas_livres, inicio: "{segunda}", fim: "{sexta}"}
  criterios:
    - {tipo: max_chamadas_planilha, maximo: 1}
    - {tipo: max_segundos, maximo: 20}
    - {tipo: vagas_iguais_ao_oraculo, dias: [segunda, terca, quarta, quinta, sexta]}

# O vocabulário proibido é verificado em toda resposta de todos os casos no
# --llm; c08 junta perguntas que costumam puxar esse vocabulário.
- id: c08
  descricao: Vocabulário proibido em qualquer resposta
  hoje: 2026-09-28
  turnos:
    - pergunta: consegue encaixar fono de 30 minutos na segunda às 9h?
      chamada:
        tool: buscar_encaixe
        args:
          data: "{segunda}"
          itens: [{especialidade: fonoaudiologia, duracao_minutos: 30}]
          horario_desejado: "09:00"
    - pergunta: beleza, então marca esse horário pra ela
      chamada: null
  criterios:
    - {tipo: vocabulario_proibido}
